<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --black: #0B0B0C; --graphite: #1C1D21; --steel: #2C2E34; --mute: #6B6F78; --line: #E3E4E8;
    --bg: #F3F3F5; --paper: #FFFFFF; --red: #C8312B; --red-tint: #FBEAE9;
    --green: #2E8B4E; --green-tint: #E7F4EC; --amber: #B26A00; --amber-tint: #FFF4E2;
    --l0: #24425E; --l1: #D08A2E; --l2: #5B7F5E; --meta: #8A8F98; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg);
         color: var(--graphite); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  /* Encabezado */
  header { background: var(--black); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  header img { width: 44px; height: 44px; border-radius: 50%; }
  .marca b { font-size: 17px; letter-spacing: .06em; } .marca b span { color: var(--red); }
  .marca small { display: block; color: #A9ACB4; font-size: 12px; margin-top: 1px; }
  header .der { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #C9CBD1; }
  .demo { background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .05em;
          padding: 4px 8px; border-radius: 6px; }
  .btn-sec { background: transparent; border: 1px solid #3A3C43; color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn-sec:hover { background: #1C1D21; }

  /* Login */
  .login { max-width: 420px; margin: 40px auto; background: var(--paper); border-radius: var(--radius); padding: 28px;
           box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .login h1 { margin: 0 0 4px; font-size: 22px; } .login p { margin: 0 0 18px; color: var(--mute); }
  .usuario { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid var(--line);
             background: #fff; border-radius: 12px; margin-bottom: 10px; cursor: pointer; text-align: left; font-weight: 600; }
  .usuario.sel { border-color: var(--black); box-shadow: inset 0 0 0 1px var(--black); }
  .ini { width: 34px; height: 34px; border-radius: 50%; background: var(--black); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .pin { width: 100%; font-size: 22px; letter-spacing: .5em; text-align: center; padding: 12px; border: 1px solid var(--line);
         border-radius: 12px; margin: 8px 0 12px; }
  .btn { width: 100%; background: var(--red); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .error { color: var(--red); min-height: 20px; margin-top: 10px; font-size: 13px; }

  /* Filtros */
  .filtros { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line);
             padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--mute); }
  .seg button.on { background: var(--paper); color: var(--black); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .nav { display: inline-flex; align-items: center; gap: 6px; }
  .nav button { width: 32px; height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .nav input, .filtros select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; height: 32px; }
  .rango { font-weight: 700; color: var(--black); }
  .filtros .der { margin-left: auto; color: var(--mute); font-size: 12px; }

  /* Pestañas */
  .tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--paper); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 12px 14px; cursor: pointer; font-weight: 600; color: var(--mute);
                 border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--black); border-bottom-color: var(--red); }

  main { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 14px; }
  .dos { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); margin-bottom: 14px; }
  .card { background: var(--paper); border-radius: var(--radius); padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.05); min-width: 0; }
  .card h3 { margin: 0 0 2px; font-size: 14px; color: var(--black); }
  .card .sub { color: var(--mute); font-size: 12px; margin-bottom: 12px; }
  .kpi .et { color: var(--mute); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .val { font-size: 26px; font-weight: 750; color: var(--black); margin: 6px 0 6px; }
  .kpi .det { font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 12px; }
  .up { background: var(--green-tint); color: var(--green); } .down { background: var(--red-tint); color: var(--red); }
  .neu { background: var(--bg); color: var(--mute); } .warn { background: var(--amber-tint); color: var(--amber); }
  .barra { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .barra i { display: block; height: 100%; border-radius: 3px; }
  .lienzo { position: relative; height: 280px; }
  .lienzo.bajo { height: 220px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--mute); margin-bottom: 8px; }
  .leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px;
                          background: var(--c); vertical-align: -1px; }
  .leyenda span.linea::before { height: 2px; vertical-align: 3px; }

  /* Tablas */
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); font-weight: 600;
       padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #F0F0F2; white-space: nowrap; }
  td.r, th.r { text-align: right; }
  td.obs { white-space: normal; min-width: 180px; color: var(--mute); }
  tr:last-child td { border-bottom: 0; }
  tfoot td { font-weight: 700; border-top: 1px solid var(--line); }
  .mini { display: inline-block; height: 8px; border-radius: 4px; background: var(--l0); vertical-align: middle; }
  .vacio { color: var(--mute); padding: 18px 0; text-align: center; }

  /* Alertas */
  .alertas { list-style: none; margin: 0; padding: 0; }
  .alertas li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #F0F0F2; align-items: flex-start; }
  .alertas li:last-child { border-bottom: 0; }
  .punto { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; }
  .turno { display: flex; flex-wrap: wrap; gap: 8px; }
  .turno span { background: var(--green-tint); color: var(--green); padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .turno span small { color: var(--mute); font-weight: 500; margin-left: 4px; }
  .cargando { text-align: center; color: var(--mute); padding: 60px 0; }

  @media (max-width: 640px) {
    header { padding: 10px 14px; } .marca small { display: none; }
    .filtros, .tabs { padding-left: 14px; padding-right: 14px; } main { padding: 14px; }
    .dos { grid-template-columns: 1fr; } .kpi .val { font-size: 22px; } .filtros .der { display: none; }
  }

  /* Indicador de carga (todas las esperas al servidor y al GPS) */
  .cargador { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
              background: rgba(11,11,12,.55); opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .cargador.show { opacity: 1; pointer-events: auto; }
  .cargador .caja { background: #fff; border-radius: 18px; padding: 24px 28px; min-width: 230px; max-width: 320px; text-align: center;
                    display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
                    transform: scale(.96); transition: transform .15s ease; }
  .cargador.show .caja { transform: none; }
  .rueda { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #ECECEF; border-top-color: #C8312B; animation: girar .8s linear infinite; }
  .cargador p { margin: 0; font-weight: 700; font-size: 16px; color: #0B0B0C; }
  .cargador small { color: #6B6F78; font-size: 13px; min-height: 1em; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rueda { animation: girar 1.6s linear infinite !important; } }

  /* Franja de efectivo (siempre visible) */
  .franjaEf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); cursor: pointer; }
  .franjaEf > div { background: var(--paper); padding: 10px 20px; min-width: 0; }
  .franjaEf small { display: block; font-size: 11px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
  .franjaEf b { font-size: 20px; color: var(--black); font-variant-numeric: tabular-nums; }
  .franjaEf em { display: block; font-style: normal; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .franjaEf .alerta em, .franjaEf .alerta b { color: var(--red); }
  .visor { position: fixed; inset: 0; z-index: 40; background: rgba(11,11,12,.75); display: grid; place-items: center; padding: 20px; }
  .visor img { max-width: min(92vw, 900px); max-height: 86vh; border-radius: 10px; background: #fff; }
  .visor button { position: absolute; top: 16px; right: 16px; }
  @media (max-width: 640px) { .franjaEf > div { padding: 8px 12px; } .franjaEf b { font-size: 16px; } .franjaEf em { display: none; } }
</style>
</head>

<script>
/* ═══════════════ Utilidades de fecha (todo en texto AAAA-MM-DD, sin zonas horarias) ═══════════════ */
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIAS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const msF = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const txF = ms => new Date(ms).toISOString().slice(0, 10);
const sumar = (s, n) => txF(msF(s) + n * 864e5);
const dsem = s => (new Date(msF(s)).getUTCDay() + 6) % 7; // 0 = lunes
const entre = (a, b) => Math.round((msF(b) - msF(a)) / 864e5);
const finMes = s => txF(Date.UTC(+s.slice(0, 4), +s.slice(5, 7), 0));
function sumarMeses(s, n) {
  const a = +s.slice(0, 4), m = +s.slice(5, 7) - 1 + n, d = +s.slice(8, 10);
  const ult = new Date(Date.UTC(a, m + 1, 0)).getUTCDate();
  return txF(Date.UTC(a, m, Math.min(d, ult)));
}
const min = (a, b) => (a < b ? a : b), max = (a, b) => (a > b ? a : b);
const fCorta = s => `${+s.slice(8, 10)} ${MESES[+s.slice(5, 7) - 1]}`;
const fMes = m => `${MESES[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;

/* ═══════════════ Formatos ═══════════════ */
const clp = n => '$' + Math.round(n || 0).toLocaleString('es-CL');
const mm = n => {
  const a = Math.abs(n || 0);
  if (a >= 1e6) return '$' + (n / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' MM';
  if (a >= 1e3) return '$' + Math.round(n / 1e3).toLocaleString('es-CL') + ' mil';
  return clp(n);
};
const pct = (x, d = 1) => (isFinite(x) ? (x * 100).toLocaleString('es-CL', { maximumFractionDigits: d }) + '%' : '—');
const ent = n => Math.round(n || 0).toLocaleString('es-CL');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function delta(a, b, etiqueta) {
  if (!b) return `<span class="chip neu">sin dato ${etiqueta}</span>`;
  const x = a / b - 1;
  return `<span class="chip ${x >= 0 ? 'up' : 'down'}">${x >= 0 ? '▲' : '▼'} ${pct(Math.abs(x))}</span> ${etiqueta}`;
}
const colorCumpl = c => (c >= 1 ? 'var(--green)' : c >= 0.9 ? 'var(--amber)' : 'var(--red)');
const COLORES = ['#24425E', '#D08A2E', '#5B7F5E', '#7A4E8C'];

const ES_VISTA_PREVIA = (typeof google === 'undefined' || !google.script) && !EN_API;
function porApi(fn, args) {

    .then(r => r.json())
    .then(r => { if (!r.ok) throw new Error(r.error); return r.data; });

  /* Indicador de carga: aparece en cada espera y avisa si tarda más de lo normal */
  let cargas = 0, tLento = null;
  function cargando(txt) {
    cargas++;
    document.getElementById('cargaTxt').textContent = txt;
    document.getElementById('cargaSub').textContent = '';
    document.getElementById('cargador').classList.add('show');
    clearTimeout(tLento);
    tLento = setTimeout(() => { document.getElementById('cargaSub').textContent = 'Está tardando un poco más de lo normal…'; }, 6000);
  }
  function listo() {
    cargas = Math.max(0, cargas - 1);
    if (!cargas) { clearTimeout(tLento); document.getElementById('cargador').classList.remove('show'); }
  }
const MENSAJES = { verComprobante: 'Cargando comprobante…', obtenerInicioDashboard: 'Cargando…', ingresarDashboard: 'Verificando tu PIN…', obtenerDashboard: 'Cargando indicadores del negocio…' };
function llamar(fn, ...args) {
  cargando(MENSAJES[fn] || 'Cargando…');
  const p = EN_API ? porApi(fn, args) : ES_VISTA_PREVIA ? new Promise(ok => setTimeout(() => ok(MOCK[fn](...args)), 600))
    : new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn](...args));
  return p.finally(listo);
}
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const leer = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

/* ═══════════════ Estado ═══════════════ */
const E = { sesion: leer('acs_dash'), R: null, per: 'mes', fecha: null, local: 'TODOS', tab: 'resumen', conIva: true, charts: [] };
const $ = id => document.getElementById(id);

/* ═══════════════ Ingreso ═══════════════ */
let elegido = null;
async function iniciar() {
  if (E.sesion && E.sesion.token) return abrirDashboard();
  // Si ya ingresó en la app de trabajadores (mismo teléfono), usa esa sesión
  const app = leer('acs_sesion');
  if (app && app.token && (!app.exp || app.exp > Date.now())) { E.sesion = { token: app.token, usuario: app.usuario }; E.desdeApp = true; return abrirDashboard(); }
  mostrarLogin();
}
async function mostrarLogin() {
  $('vLogin').classList.remove('hidden');
  let r = null; try { r = JSON.parse(document.getElementById('datosInicio').textContent); } catch (e) {}
  if (!r || !r.usuarios) r = await llamar('obtenerInicioDashboard');
  $('usuarios').innerHTML = r.usuarios.length ? r.usuarios.map(u =>
    `<button class="usuario" data-id="${esc(u.id)}"><span class="ini">${esc(u.nombre.split(' ').map(p => p[0]).join('').slice(0, 2))}</span>${esc(u.nombre)}</button>`).join('')
    : '<p class="vacio">No hay usuarios con acceso. Revisa Config › ACCESO_DASHBOARD.</p>';
  $('usuarios').querySelectorAll('.usuario').forEach(b => b.onclick = () => {
    elegido = b.dataset.id;
    $('usuarios').querySelectorAll('.usuario').forEach(x => x.classList.toggle('sel', x === b));
    $('pin').focus(); validarPin();
  });
}
function validarPin() { $('entrar').disabled = !(elegido && /^\d{4}$/.test($('pin').value)); }
$('pin').oninput = validarPin;
$('pin').onkeydown = e => { if (e.key === 'Enter' && !$('entrar').disabled) $('entrar').click(); };
$('entrar').onclick = async () => {
  $('entrar').disabled = true; $('errLogin').textContent = '';
  try {
    const r = await llamar('ingresarDashboard', elegido, $('pin').value);
    if (!r.ok) { $('errLogin').textContent = r.error; $('pin').value = ''; return; }
    E.sesion = { token: r.token, usuario: r.usuario }; guardar('acs_dash', E.sesion);
    $('vLogin').classList.add('hidden'); abrirDashboard();
  } catch (e) { $('errLogin').textContent = 'No se pudo conectar. Intenta de nuevo.'; }
  finally { validarPin(); }
};
$('salir').onclick = () => { guardar('acs_dash', null); location.reload(); };

/* ═══════════════ Carga de datos ═══════════════ */
async function abrirDashboard() {
  $('vDash').classList.remove('hidden'); $('salir').classList.remove('hidden');
  $('quien').textContent = E.sesion.usuario.nombre;
  cargando('Cargando indicadores del negocio…'); // se mantiene hasta que los gráficos estén dibujados
  try {
    const R = await llamar('obtenerDashboard', E.sesion.token);
    $('cargaTxt').textContent = 'Preparando gráficos…';
    await new Promise(r => setTimeout(r, 30)); // deja que se vea el mensaje antes del cálculo
    if (R.demo) generarDemo(R);
    prepararIndices(R);
    E.R = R;
    if (R.urlApp) { $('volverApp').href = EN_API ? './' : R.urlApp; $('volverApp').classList.remove('hidden'); }
    E.fecha = R.ultimaVenta || R.hoy;
    $('badgeDemo').classList.toggle('hidden', !R.demo);
    $('actualizado').textContent = `Ventas hasta ${R.ultimaVenta ? fCorta(R.ultimaVenta) : '—'} · actualizado ${R.hora}`;
    pintarFranja();
    $('local').innerHTML = '<option value="TODOS">Todos los locales</option>' + R.locales.map(l => `<option>${esc(l)}</option>`).join('');
    pintar();
  } catch (e) {
    const m = String(e && e.message || e);
    if (/SESION|SIN_ACCESO/.test(m)) {
      guardar('acs_dash', null); E.sesion = null;
      $('vDash').classList.add('hidden'); $('salir').classList.add('hidden'); $('quien').textContent = '';
      if (E.desdeApp && /SIN_ACCESO/.test(m)) $('errLogin').textContent = 'Tu usuario no tiene acceso al dashboard.';
      E.desdeApp = false; return mostrarLogin();
    }
    $('contenido').innerHTML = `<div class="cargando">No se pudieron cargar los datos: ${esc(m)}</div>`;
  } finally { listo(); }
}

/* Índices: diario[fecha][local] y mensual[mes][local] = {v: venta según selector IVA, n: documentos, p: meta, b: con IVA, nt: sin IVA} */
const IVA = 1.19;
function prepararIndices(R) {
  const di = {}, me = {};
  const celda = (o, k, l) => ((o[k] = o[k] || {})[l] = o[k][l] || { v: 0, n: 0, p: 0, b: 0, nt: 0 });
  R.dias.forEach(([f, l, v, n, vn]) => {
    const neto = vn == null ? Math.round(v / IVA) : vn;
    [celda(di, f, l), celda(me, f.slice(0, 7), l)].forEach(a => { a.v += E.conIva ? v : neto; a.n += n; a.b += v; a.nt += neto; });
  });
  R.ppto.forEach(([f, l, p]) => { const m = E.conIva ? p : p / IVA; celda(di, f, l).p += m; celda(me, f.slice(0, 7), l).p += m; });
  R.diario = di; R.mensual = me;
  R.ultimaVenta = R.dias.reduce((m, d) => (d[2] > 0 && d[0] > m ? d[0] : m), '');
  R.primerCierre = R.cierres.reduce((m, c) => (!m || c.f < m ? c.f : m), '');
}

/* Suma ventas, documentos y presupuesto entre dos fechas para el local elegido */
function total(ini, fin, local = E.local) {
  const t = { v: 0, n: 0, p: 0, b: 0, nt: 0 };
  for (let f = ini; f <= fin; f = sumar(f, 1)) {
    const d = E.R.diario[f]; if (!d) continue;
    for (const l in d) if (local === 'TODOS' || l === local) for (const k in t) t[k] += d[l][k];
  }
  return t;
}
function totalMes(mes, local = E.local) {
  const t = { v: 0, n: 0, p: 0, b: 0, nt: 0 }, d = E.R.mensual[mes] || {};
  for (const l in d) if (local === 'TODOS' || l === local) for (const k in t) t[k] += d[l][k];
  return t;
}

/* ═══════════════ Períodos ═══════════════ */
function rango(per, f) {
  if (per === 'dia') return { ini: f, fin: f };
  if (per === 'semana') { const i = sumar(f, -dsem(f)); return { ini: i, fin: sumar(i, 6) }; }
  if (per === 'mes') return { ini: f.slice(0, 7) + '-01', fin: finMes(f) };
  return { ini: f.slice(0, 4) + '-01-01', fin: f.slice(0, 4) + '-12-31' };
}
function mover(per, f, n) {
  if (per === 'dia') return sumar(f, n);
  if (per === 'semana') return sumar(f, 7 * n);
  if (per === 'mes') return sumarMeses(f, n);
  return sumarMeses(f, 12 * n);
}
function etiquetaRango(per, r) {
  if (per === 'dia') return `${DIAS[dsem(r.ini)]} ${fCorta(r.ini)} ${r.ini.slice(0, 4)}`;
  if (per === 'semana') return `Semana ${fCorta(r.ini)} – ${fCorta(r.fin)}`;
  if (per === 'mes') return `${MESES[+r.ini.slice(5, 7) - 1].replace(/^./, c => c.toUpperCase())} ${r.ini.slice(0, 4)}`;
  return `Año ${r.ini.slice(0, 4)}`;
}
/* Período comparable recortado a la misma cantidad de días transcurridos */
function comparable(r, corte, tipo) {
  const per = E.per;
  let ini;
  if (tipo === 'anterior') ini = per === 'dia' || per === 'semana' ? sumar(r.ini, -7) : sumarMeses(r.ini, per === 'mes' ? -1 : -12);
  else ini = per === 'dia' || per === 'semana' ? sumar(r.ini, -364) : sumarMeses(r.ini, -12);
  const r2 = rango(per === 'dia' ? 'dia' : per, ini);
  return { ini: r2.ini, fin: min(r2.fin, sumar(r2.ini, entre(r.ini, corte))) };
}

/* ═══════════════ Pintado general ═══════════════ */
function pintar() {
  E.charts.forEach(c => c.destroy()); E.charts = [];
  const r = rango(E.per, E.fecha);
  $('fecha').value = E.fecha;
  $('rango').textContent = etiquetaRango(E.per, r);
  ({ resumen: tabResumen, ventas: tabVentas, productos: tabProductos, caja: tabCaja, equipo: tabEquipo, efectivo: tabEfectivo })[E.tab](r);
}
document.querySelectorAll('#segPeriodo button').forEach(b => b.onclick = () => {
  E.per = b.dataset.p; document.querySelectorAll('#segPeriodo button').forEach(x => x.classList.toggle('on', x === b)); pintar();
});
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  E.tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); pintar();
});
document.querySelectorAll('#segIva button').forEach(b => b.onclick = () => {
  E.conIva = b.dataset.i === '1'; document.querySelectorAll('#segIva button').forEach(x => x.classList.toggle('on', x === b));
  prepararIndices(E.R); pintar();
});
$('ant').onclick = () => { E.fecha = mover(E.per, E.fecha, -1); pintar(); };
$('sig').onclick = () => { E.fecha = mover(E.per, E.fecha, 1); pintar(); };
$('fecha').onchange = e => { if (e.target.value) { E.fecha = e.target.value; pintar(); } };
$('local').onchange = e => { E.local = e.target.value; pintar(); };

const localesVisibles = () => (E.local === 'TODOS' ? E.R.locales : [E.local]);
const colorLocal = l => COLORES[Math.max(0, E.R.locales.indexOf(l)) % COLORES.length];
const meses = r => { const m = []; for (let x = r.ini.slice(0, 7); x <= r.fin.slice(0, 7); x = sumarMeses(x + '-01', 1).slice(0, 7)) m.push(x); return m; };
const etiquetaMeses = r => { const m = meses(r); return m.length === 1 ? fMes(m[0]) : `${fMes(m[0])} – ${fMes(m[m.length - 1])}`; };
function kpi(et, val, det, barra) {
  return `<div class="card kpi"><div class="et">${et}</div><div class="val num">${val}</div><div class="det">${det || ''}</div>${barra || ''}</div>`;
}
function barraCumpl(c) { return `<div class="barra"><i style="width:${Math.min(100, (c || 0) * 100)}%;background:${colorCumpl(c)}"></i></div>`; }
function grafico(id, cfg) {
  const base = {
    responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${cfg.fmt ? cfg.fmt(c.raw) : clp(c.raw)}` } } },
    scales: {
      x: { grid: { display: false }, ticks: { color: '#6B6F78', maxRotation: 0, autoSkip: true } },
      y: { beginAtZero: true, grid: { color: '#EEEFF2' }, border: { display: false }, ticks: { color: '#6B6F78', callback: v => (cfg.fmtEje || mm)(v) } },
    },
  };
  if (cfg.horizontal) { base.indexAxis = 'y'; [base.scales.x, base.scales.y] = [base.scales.y, base.scales.x]; base.scales.y.grid = { display: false }; }
  if (cfg.apilado) { base.scales.x.stacked = true; base.scales.y.stacked = true; }
  E.charts.push(new Chart($(id), { type: cfg.tipo || 'bar', data: cfg.data, options: base }));
}
const leyenda = items => `<div class="leyenda">${items.map(([t, c, linea]) => `<span class="${linea ? 'linea' : ''}" style="--c:${c}">${esc(t)}</span>`).join('')}</div>`;

/* Subdivisión del período para los gráficos de evolución */
function tramos(r) {
  if (E.per === 'ano') return meses(r).map(m => ({ et: MESES[+m.slice(5, 7) - 1], ini: m + '-01', fin: finMes(m + '-01') }));
  const ini = E.per === 'dia' ? sumar(r.ini, -13) : r.ini, fin = E.per === 'dia' ? r.fin : r.fin;
  const t = []; for (let f = ini; f <= fin; f = sumar(f, 1)) t.push({ et: E.per === 'semana' ? `${DIAS[dsem(f)]} ${+f.slice(8)}` : String(+f.slice(8)), ini: f, fin: f });
  return t;
}

/* ═══════════════ Pestaña Resumen ═══════════════ */
function tabResumen(r) {
  const R = E.R, corte = min(r.fin, R.ultimaVenta || r.fin), enCurso = corte < r.fin;
  const a = total(r.ini, corte);
  const pptoTotal = total(r.ini, r.fin).p;
  const ant = comparable(r, corte, 'anterior'), aa = comparable(r, corte, 'anio');
  const tAnt = total(ant.ini, ant.fin), tAA = total(aa.ini, aa.fin);
  const cumpl = a.p ? a.v / a.p : NaN;
  const proy = !enCurso ? a.v : a.p ? a.v / a.p * pptoTotal : a.v / (entre(r.ini, corte) + 1) * (entre(r.ini, r.fin) + 1);
  const etAnt = { dia: 'vs mismo día sem. anterior', semana: 'vs semana anterior', mes: 'vs mes anterior', ano: 'vs año anterior' }[E.per];

  const mg = margenRango(r), conv = conversion(r.ini, corte);
  let html = '<div class="grid kpis">';
  html += kpi(`Venta ${E.conIva ? 'con' : 'sin'} IVA` + (enCurso ? ' a la fecha' : ''), mm(a.v), delta(a.v, tAnt.v, etAnt) + (E.per !== 'ano' ? ' ' + delta(a.v, tAA.v, 'vs año anterior') : ''));
  html += kpi('Cumplimiento presupuesto', a.p ? pct(cumpl, 0) : '—',
    a.p ? `Meta a la fecha ${mm(a.p)} · período ${mm(pptoTotal)}` : '<span class="chip warn">Sin presupuesto cargado</span>', a.p ? barraCumpl(cumpl) : '');
  html += kpi(enCurso ? 'Proyección de cierre' : 'Venta final del período', mm(proy),
    enCurso ? (pptoTotal ? `${pct(proy / pptoTotal, 0)} de la meta del período` : 'Ritmo diario actual') : (pptoTotal ? `${pct(a.v / pptoTotal, 0)} de la meta` : ''));
  html += kpi('Ticket promedio', a.n ? clp(a.v / a.n) : '—', `${ent(a.n)} documentos · ${delta(a.n ? a.v / a.n : 0, tAA.n ? tAA.v / tAA.n : 0, 'vs año ant.')}`);
  html += kpi('Margen bruto', mg.venta ? pct(mg.margen / mg.venta) : '—', mg.venta ? `${mm(mg.margen)} · empresa · ${etiquetaMeses(r)}` : 'Sin datos de margen');
  html += kpi('IVA débito', mm(a.b - a.nt), a.b ? `${pct((a.b - a.nt) / a.b)} de la venta · neto ${mm(a.nt)} · bruto ${mm(a.b)}` : 'Sin ventas');
  html += kpi('Conversión de visitas', conv.visitas ? pct(conv.compras / conv.visitas, 0) : '—',
    conv.visitas ? `${ent(conv.compras)} compras de ${ent(conv.visitas)} visitas` : 'Sin cierres con visitas');
  html += '</div>';

  // Acumulados del mes y del año
  const ref = min(R.ultimaVenta || E.fecha, E.fecha);
  const mtd = total(ref.slice(0, 7) + '-01', ref), mtdAA = total(sumarMeses(ref.slice(0, 7) + '-01', -12), sumarMeses(ref, -12));
  const ytd = total(ref.slice(0, 4) + '-01-01', ref), ytdAA = total(sumarMeses(ref.slice(0, 4) + '-01-01', -12), sumarMeses(ref, -12));
  html += '<div class="grid kpis">';
  html += kpi(`Acumulado mes al ${fCorta(ref)}`, mm(mtd.v), (mtd.p ? `<span class="chip ${mtd.v >= mtd.p ? 'up' : 'down'}">${pct(mtd.v / mtd.p, 0)} meta</span> ` : '') + delta(mtd.v, mtdAA.v, 'vs año ant.'), mtd.p ? barraCumpl(mtd.v / mtd.p) : '');
  html += kpi(`Acumulado año al ${fCorta(ref)}`, mm(ytd.v), (ytd.p ? `<span class="chip ${ytd.v >= ytd.p ? 'up' : 'down'}">${pct(ytd.v / ytd.p, 0)} meta</span> ` : '') + delta(ytd.v, ytdAA.v, 'vs año ant.'), ytd.p ? barraCumpl(ytd.v / ytd.p) : '');
  html += '</div>';

  html += `<div class="grid dos">
    <div class="card"><h3>Evolución de ventas vs presupuesto</h3><div class="sub">${E.per === 'dia' ? 'Últimos 14 días' : E.per === 'ano' ? 'Por mes' : 'Por día'}</div>
      ${leyenda(localesVisibles().map(l => [l, colorLocal(l)]).concat([['Presupuesto', 'var(--meta)', 1]]))}<div class="lienzo"><canvas id="gEvo"></canvas></div></div>
    <div class="card"><h3>Acumulado vs meta</h3><div class="sub">${E.per === 'dia' ? 'Mes en curso' : 'Dentro del período'}</div>
      ${leyenda([['Venta acumulada', COLORES[0], 1], ['Meta acumulada', 'var(--meta)', 1], ['Año anterior', '#C9CCD3', 1]])}<div class="lienzo"><canvas id="gAcu"></canvas></div></div>
  </div>`;

  html += `<div class="grid dos"><div class="card"><h3>Por local</h3><div class="sub">${esc(etiquetaRango(E.per, r))}${enCurso ? ' · a la fecha' : ''}</div><div class="tabla">${tablaLocales(r, corte)}</div></div>
    <div class="card"><h3>Alertas</h3><div class="sub">Lo que requiere atención en el período</div>${alertas(r, corte)}</div></div>`;
  $('contenido').innerHTML = html;

  // Evolución
  const t = tramos(r);
  grafico('gEvo', {
    apilado: true,
    data: {
      labels: t.map(x => x.et),
      datasets: localesVisibles().map(l => ({ label: l, data: t.map(x => total(x.ini, x.fin, l).v), backgroundColor: colorLocal(l), borderRadius: 3, stack: 'v', order: 2 }))
        .concat([{ type: 'line', label: 'Presupuesto', data: t.map(x => total(x.ini, x.fin).p || null), borderColor: '#8A8F98', borderDash: [5, 4],
          borderWidth: 2, pointRadius: 0, stack: 'p', order: 1, spanGaps: true }]),
    },
  });
  // Acumulado
  const rA = E.per === 'dia' ? rango('mes', E.fecha) : r;
  const tA = E.per === 'ano' ? tramos(rA) : (() => { const x = []; for (let f = rA.ini; f <= rA.fin; f = sumar(f, 1)) x.push({ et: String(+f.slice(8)), ini: f, fin: f }); return x; })();
  let sv = 0, sp = 0, sa = 0; const off = E.per === 'semana' ? -364 : null;
  const ac = tA.map(x => {
    const tt = total(x.ini, x.fin);
    const iniAA = off ? sumar(x.ini, off) : sumarMeses(x.ini, -12), finAA = off ? sumar(x.fin, off) : sumarMeses(x.fin, -12);
    sv += tt.v; sp += tt.p; sa += total(iniAA, finAA).v;
    return { v: x.ini <= (R.ultimaVenta || '') ? sv : null, p: sp || null, a: sa };
  });
  grafico('gAcu', {
    tipo: 'line',
    data: {
      labels: tA.map(x => x.et),
      datasets: [
        { label: 'Venta acumulada', data: ac.map(x => x.v), borderColor: COLORES[0], backgroundColor: 'rgba(36,66,94,.08)', fill: true, borderWidth: 2.5, pointRadius: 0, tension: .2 },
        { label: 'Meta acumulada', data: ac.map(x => x.p), borderColor: '#8A8F98', borderDash: [5, 4], borderWidth: 2, pointRadius: 0 },
        { label: 'Año anterior', data: ac.map(x => x.a), borderColor: '#C9CCD3', borderWidth: 2, pointRadius: 0, tension: .2 },
      ],
    },
  });
}

function tablaLocales(r, corte) {
  const filas = E.R.locales.map(l => {
    const a = total(r.ini, corte, l), aa = comparable(r, corte, 'anio'), tAA = total(aa.ini, aa.fin, l);
    const cv = conversion(r.ini, corte, l), dif = cierresRango(r.ini, corte, l).filter(c => Math.abs(c.dif) > E.R.tolerancia).length;
    return { l, a, tAA, cv, dif };
  });
  const T = filas.reduce((s, x) => ({ v: s.v + x.a.v, p: s.p + x.a.p, n: s.n + x.a.n, aa: s.aa + x.tAA.v }), { v: 0, p: 0, n: 0, aa: 0 });
  const fila = x => `<tr><td><span class="mini" style="width:10px;background:${colorLocal(x.l)}"></span> ${esc(x.l)}</td>
    <td class="r num">${mm(x.a.v)}</td><td class="r num">${x.a.p ? mm(x.a.p) : '—'}</td>
    <td class="r num" style="color:${x.a.p ? colorCumpl(x.a.v / x.a.p) : 'inherit'};font-weight:700">${x.a.p ? pct(x.a.v / x.a.p, 0) : '—'}</td>
    <td class="r num">${x.tAA.v ? pct(x.a.v / x.tAA.v - 1, 0) : '—'}</td><td class="r num">${x.a.n ? clp(x.a.v / x.a.n) : '—'}</td>
    <td class="r num">${x.cv.visitas ? pct(x.cv.compras / x.cv.visitas, 0) : '—'}</td>
    <td class="r num">${x.dif ? `<span class="chip down">${x.dif}</span>` : '0'}</td></tr>`;
  return `<table><thead><tr><th>Local</th><th class="r">Venta</th><th class="r">Meta</th><th class="r">Cumpl.</th><th class="r">vs año ant.</th>
    <th class="r">Ticket</th><th class="r">Conversión</th><th class="r">Dif. caja</th></tr></thead><tbody>${filas.map(fila).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="r num">${mm(T.v)}</td><td class="r num">${T.p ? mm(T.p) : '—'}</td><td class="r num">${T.p ? pct(T.v / T.p, 0) : '—'}</td>
    <td class="r num">${T.aa ? pct(T.v / T.aa - 1, 0) : '—'}</td><td class="r num">${T.n ? clp(T.v / T.n) : '—'}</td><td></td><td></td></tr></tfoot></table>`;
}

function alertas(r, corte) {
  const R = E.R, items = [];
  const add = (nivel, texto) => items.push([nivel, texto]);
  localesVisibles().forEach(l => {
    const a = total(r.ini, corte, l);
    if (!a.p) add('warn', `${l}: no hay presupuesto cargado para este período.`);
    else if (a.v / a.p < 0.9) add('down', `${l}: va al ${pct(a.v / a.p, 0)} de la meta (faltan ${mm(a.p - a.v)}).`);
  });
  const cie = cierresRango(r.ini, corte);
  const difs = cie.filter(c => Math.abs(c.dif) > R.tolerancia);
  if (difs.length) add('down', `${difs.length} cierre(s) con diferencia mayor a ${clp(R.tolerancia)} entre lo declarado y Bicom.`);
  const sin = diasSinCierre(r.ini, min(corte, sumar(R.hoy, -1)));
  if (sin.length) add('warn', `${sin.length} día(s) con ventas y sin cierre registrado.`);
  const fuera = marcasRango(r.ini, r.fin).filter(m => m.ubic === 'FUERA DE RANGO');
  if (fuera.length) add('warn', `${fuera.length} marca(s) de asistencia hechas fuera del local.`);
  const abiertas = jornadas(r.ini, min(r.fin, sumar(R.hoy, -1))).filter(j => !j.salida).length;
  if (abiertas) add('warn', `${abiertas} jornada(s) con entrada y sin salida.`);
  if (R.stockBajo.length) add('neu', `${R.stockBajo.length} producto(s) con stock bajo (ver Productos y margen).`);
  if (!items.length) return '<p class="vacio">Sin alertas en el período 👌</p>';
  const color = { down: 'var(--red)', warn: 'var(--amber)', neu: 'var(--mute)' };
  return `<ul class="alertas">${items.map(([n, t]) => `<li><span class="punto" style="background:${color[n]}"></span><span>${esc(t)}</span></li>`).join('')}</ul>`;
}

/* Suma un arreglo mensual [mes, local, clave, monto…] dentro de los meses del período */
function agrupar(filas, r, iClave, iMonto) {
  const ms = meses(r), acc = {};
  filas.forEach(x => { if (ms.includes(x[0]) && (E.local === 'TODOS' || x[1] === E.local)) acc[x[iClave]] = (acc[x[iClave]] || 0) + x[iMonto]; });
  return Object.entries(acc).sort((a, b) => b[1] - a[1]);
}
function agruparVendedores(r) {
  const ms = meses(r), acc = {};
  E.R.vendedores.forEach(([m, l, n, v, d]) => {
    if (!ms.includes(m) || (E.local !== 'TODOS' && l !== E.local)) return;
    const a = acc[n] || (acc[n] = [n, 0, 0]); a[1] += v; a[2] += d;
  });
  return Object.values(acc).sort((a, b) => b[1] - a[1]);
}

/* ═══════════════ Pestaña Caja y cierres ═══════════════ */
function cierresRango(ini, fin, local = E.local) {
  return E.R.cierres.filter(c => c.f >= ini && c.f <= fin && (local === 'TODOS' || c.l === local)).map(c => {
    const b = (E.R.diario[c.f] || {})[c.l];
    return Object.assign({}, c, { bicom: b ? b.b : null, dif: b && b.b ? c.ventas - b.b : 0 }); // el cierre se declara con IVA
  });
}
function conversion(ini, fin, local = E.local) {
  return cierresRango(ini, fin, local).reduce((s, c) => ({ visitas: s.visitas + c.visitas, compras: s.compras + (c.visitas - c.sinCompra) }), { visitas: 0, compras: 0 });
}
function diasSinCierre(ini, fin) {
  const R = E.R, out = []; if (!R.primerCierre) return out;
  for (let f = max(ini, R.primerCierre); f <= fin; f = sumar(f, 1)) localesVisibles().forEach(l => {
    const d = (R.diario[f] || {})[l];
    if (d && d.v > 0 && !R.cierres.some(c => c.f === f && c.l === l)) out.push([f, l]);
  });
  return out;
}

/* ═══════════════ Pestaña Equipo ═══════════════ */
function marcasRango(ini, fin) {
  return E.R.marcajes.filter(m => m.f >= ini && m.f <= fin && (E.local === 'TODOS' || m.l === E.local));
}
/* Une entrada y salida de cada persona por día */
function jornadas(ini, fin) {
  const out = [], abiertas = {};
  marcasRango(ini, fin).slice().sort((a, b) => (a.f + a.h < b.f + b.h ? -1 : 1)).forEach(m => {
    const k = m.id + '|' + m.f;
    if (m.tipo === 'ENTRADA') { const j = { id: m.id, nombre: m.nombre, f: m.f, l: m.l, entrada: m.h, salida: null }; out.push(j); abiertas[k] = j; }
    else if (abiertas[k]) { abiertas[k].salida = m.h; delete abiertas[k]; }
  });
  return out;
}
const minutos = h => +h.slice(0, 2) * 60 + +h.slice(3, 5);
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.round(m % 60)).padStart(2, '0')}`;
function tabEquipo(r) {
  const R = E.R;
  const hoy = jornadas(R.hoy, R.hoy).filter(j => !j.salida);
  const js = jornadas(r.ini, min(r.fin, R.hoy));
  const per = {};
  js.forEach(j => {
    const p = per[j.id] || (per[j.id] = { nombre: j.nombre, dias: new Set(), min: 0, cerradas: 0, ent: 0, sal: 0, abiertas: 0, fuera: 0 });
    p.dias.add(j.f); p.ent += minutos(j.entrada);
    if (j.salida) { p.min += minutos(j.salida) - minutos(j.entrada); p.cerradas++; p.sal += minutos(j.salida); } else if (j.f < R.hoy) p.abiertas++;
  });
  const fuera = marcasRango(r.ini, r.fin).filter(m => m.ubic === 'FUERA DE RANGO');
  fuera.forEach(m => { if (per[m.id]) per[m.id].fuera++; });
  const filas = Object.values(per).sort((a, b) => b.min - a.min);

  $('contenido').innerHTML = `
  <div class="card" style="margin-bottom:14px"><h3>En turno ahora</h3><div class="sub">Con entrada marcada hoy y sin salida · ${R.hora}</div>
    ${hoy.length ? `<div class="turno">${hoy.map(j => `<span>${esc(j.nombre)}<small>${esc(j.l)} · desde ${j.entrada}</small></span>`).join('')}</div>` : '<p class="vacio">Nadie ha marcado entrada hoy</p>'}</div>
  <div class="card" style="margin-bottom:14px"><h3>Asistencia por persona</h3><div class="sub">${esc(etiquetaRango(E.per, r))} · control interno (no es el registro oficial de asistencia)</div>
    ${filas.length ? `<div class="tabla"><table><thead><tr><th>Persona</th><th class="r">Días</th><th class="r">Horas</th><th class="r">Prom. diario</th><th class="r">Entrada prom.</th>
      <th class="r">Salida prom.</th><th class="r">Sin salida</th><th class="r">Fuera del local</th></tr></thead><tbody>
    ${filas.map(p => `<tr><td>${esc(p.nombre)}</td><td class="r num">${p.dias.size}</td><td class="r num">${hhmm(p.min)}</td>
      <td class="r num">${p.cerradas ? hhmm(p.min / p.cerradas) : '—'}</td><td class="r num">${hhmm(p.ent / p.dias.size)}</td>
      <td class="r num">${p.cerradas ? hhmm(p.sal / p.cerradas) : '—'}</td>
      <td class="r num">${p.abiertas ? `<span class="chip warn">${p.abiertas}</span>` : '0'}</td>
      <td class="r num">${p.fuera ? `<span class="chip warn">${p.fuera}</span>` : '0'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin marcas en el período</p>'}</div>
  ${fuera.length ? `<div class="card"><h3>Marcas fuera del local</h3><div class="sub">Hechas a más distancia que el radio permitido</div><div class="tabla"><table>
    <thead><tr><th>Fecha</th><th>Persona</th><th>Local</th><th>Tipo</th><th class="r">Distancia</th></tr></thead><tbody>
    ${fuera.map(m => `<tr><td>${fCorta(m.f)} ${m.h}</td><td>${esc(m.nombre)}</td><td>${esc(m.l)}</td><td>${esc(m.tipo)}</td><td class="r num">${ent(m.dist)} m</td></tr>`).join('')}
    </tbody></table></div></div>` : ''}`;
}
