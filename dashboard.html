<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoCarSur · Dashboard</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="AutoCarSur">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">

<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --black: #0B0B0C; --graphite: #1C1D21; --steel: #2C2E34; --mute: #6B6F78; --line: #E3E4E8;
    --bg: #F3F3F5; --paper: #FFFFFF; --red: #C8312B; --red-tint: #FBEAE9;
    --green: #2E8B4E; --green-tint: #E7F4EC; --amber: #B26A00; --amber-tint: #FFF4E2;
    --l0: #24425E; --l1: #D08A2E; --l2: #5B7F5E; --meta: #8A8F98; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg);
         color: var(--graphite); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  /* Encabezado */
  header { background: var(--black); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  header img { width: 44px; height: 44px; border-radius: 50%; }
  .marca b { font-size: 17px; letter-spacing: .06em; } .marca b span { color: var(--red); }
  .marca small { display: block; color: #A9ACB4; font-size: 12px; margin-top: 1px; }
  header .der { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px 12px; font-size: 13px; color: #C9CBD1; }
  header .der .salto { flex-basis: 100%; height: 0; }
  #btnAct { white-space: nowrap; }
  @media (max-width: 480px) { header { flex-wrap: wrap; row-gap: 8px; } header .der { flex-basis: 100%; } }
  .sync { font-size: 12px; color: #C9CBD1; display: inline-flex; align-items: center; gap: 6px; }
  .act-linea { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 20px 4px; font-size: 13px; color: var(--mute); }
  @media (max-width: 640px) { .act-linea { padding: 8px 14px 4px; } }
  .act-linea .viejo { color: var(--amber); font-weight: 700; }
  .act-linea button { border: 1.5px solid var(--line); background: var(--paper); color: var(--black); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .act-linea button:disabled { opacity: .6; cursor: default; }
  .sync::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #5A5C63; border-top-color: #fff; animation: girar .8s linear infinite; }
  .demo { background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .05em;
          padding: 4px 8px; border-radius: 6px; }
  .btn-sec { background: transparent; border: 1px solid #3A3C43; color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn-sec:hover { background: #1C1D21; }

  /* Login */
  .login { max-width: 420px; margin: 40px auto; background: var(--paper); border-radius: var(--radius); padding: 28px;
           box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .login h1 { margin: 0 0 4px; font-size: 22px; } .login p { margin: 0 0 18px; color: var(--mute); }
  .usuario { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid var(--line);
             background: #fff; border-radius: 12px; margin-bottom: 10px; cursor: pointer; text-align: left; font-weight: 600; }
  .usuario.sel { border-color: var(--black); box-shadow: inset 0 0 0 1px var(--black); }
  .ini { width: 34px; height: 34px; border-radius: 50%; background: var(--black); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .pin { width: 100%; font-size: 22px; letter-spacing: .5em; text-align: center; padding: 12px; border: 1px solid var(--line);
         border-radius: 12px; margin: 8px 0 12px; }
  .btn { width: 100%; background: var(--red); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .error { color: var(--red); min-height: 20px; margin-top: 10px; font-size: 13px; }

  /* Filtros */
  .filtros { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line);
             padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--mute); }
  .seg button.on { background: var(--paper); color: var(--black); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .nav { display: inline-flex; align-items: center; gap: 6px; }
  .nav button { width: 32px; height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .nav input, .filtros select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; height: 32px; }
  .rango { font-weight: 700; color: var(--black); }
  .pers-et { font-size: 12px; color: var(--mute); font-weight: 600; }
  .pers-par { display: inline-flex; align-items: center; gap: 6px; }
  @media (max-width: 640px) { #segPeriodo button { padding: 7px 9px; } #persBox { flex-wrap: wrap; } }
  .filtros .der { margin-left: auto; color: var(--mute); font-size: 12px; }

  /* Pestañas */
  .tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--paper); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 12px 14px; cursor: pointer; font-weight: 600; color: var(--mute);
                 border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--black); border-bottom-color: var(--red); }

  main { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 14px; }
  @media (min-width: 1000px) {
    .kpis.fila { grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); gap: 10px; }
    .kpis.fila .kpi { padding: 14px; } .kpis.fila .kpi .val { font-size: 22px; } .kpis.fila .kpi .et { font-size: 11px; }
  }
  .dos { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); margin-bottom: 14px; }
  .card { background: var(--paper); border-radius: var(--radius); padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.05); min-width: 0; }
  .card h3 { margin: 0 0 2px; font-size: 14px; color: var(--black); }
  .card .sub { color: var(--mute); font-size: 12px; margin-bottom: 12px; }
  .kpi .et { color: var(--mute); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .val { font-size: 26px; font-weight: 750; color: var(--black); margin: 6px 0 6px; }
  .kpi .det { font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-block; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 12px; }
  .up { background: var(--green-tint); color: var(--green); } .down { background: var(--red-tint); color: var(--red); }
  .neu { background: var(--bg); color: var(--mute); } .warn { background: var(--amber-tint); color: var(--amber); }
  .barra { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .barra i { display: block; height: 100%; border-radius: 3px; }
  .lienzo { position: relative; height: 280px; }
  .lienzo.bajo { height: 220px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--mute); margin-bottom: 8px; }
  .leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px;
                          background: var(--c); vertical-align: -1px; }
  .leyenda span.linea::before { height: 2px; vertical-align: 3px; }

  /* Tablas */
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); font-weight: 600;
       padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #F0F0F2; white-space: nowrap; }
  td.r, th.r { text-align: right; }
  td.obs { white-space: normal; min-width: 180px; color: var(--mute); }
  tr:last-child td { border-bottom: 0; }
  tfoot td { font-weight: 700; border-top: 1px solid var(--line); }
  .mini { display: inline-block; height: 8px; border-radius: 4px; background: var(--l0); vertical-align: middle; }
  .vacio { color: var(--mute); padding: 18px 0; text-align: center; }

  /* Alertas */
  .alertas { list-style: none; margin: 0; padding: 0; }
  .alertas li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #F0F0F2; align-items: flex-start; }
  .alertas li:last-child { border-bottom: 0; }
  .punto { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; }
  .turno { display: flex; flex-wrap: wrap; gap: 8px; }
  .turno span { background: var(--green-tint); color: var(--green); padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .turno span small { color: var(--mute); font-weight: 500; margin-left: 4px; }
  .cargando { text-align: center; color: var(--mute); padding: 60px 0; }

  @media (max-width: 640px) {
    header { padding: 10px 14px; } .marca small { display: none; }
    .filtros, .tabs { padding-left: 14px; padding-right: 14px; } main { padding: 14px; }
    .dos { grid-template-columns: 1fr; } .kpi .val { font-size: 22px; } .filtros .der { display: none; }
  }

  /* Indicador de carga (todas las esperas al servidor y al GPS) */
  .cargador { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
              background: rgba(11,11,12,.55); opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .cargador.show { opacity: 1; pointer-events: auto; }
  .cargador .caja { background: #fff; border-radius: 18px; padding: 24px 28px; min-width: 230px; max-width: 320px; text-align: center;
                    display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
                    transform: scale(.96); transition: transform .15s ease; }
  .cargador.show .caja { transform: none; }
  .rueda { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #ECECEF; border-top-color: #C8312B; animation: girar .8s linear infinite; }
  /* Barra de carga (V41) */
  .barra-carga { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; z-index: 40; pointer-events: none;
                 background: #C8312B; box-shadow: 0 0 6px rgba(200,49,43,.45); opacity: 0; transition: width .25s ease-out, opacity .3s ease; }
  .barra-carga.show { opacity: 1; }
  .cargador .pista { width: 100%; height: 6px; border-radius: 3px; background: #ECECEF; overflow: hidden; }
  .cargador .pista i { display: block; height: 100%; width: 0; background: #C8312B; border-radius: 3px; transition: width .25s ease-out; }
  @media (prefers-reduced-motion: reduce) { .barra-carga, .cargador .pista i { transition: none; } }
  .cargador p { margin: 0; font-weight: 700; font-size: 16px; color: #0B0B0C; }
  .cargador small { color: #6B6F78; font-size: 13px; min-height: 1em; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rueda { animation: girar 1.6s linear infinite !important; } }

  /* Franja de efectivo (siempre visible) */
  .franjaEf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto auto auto; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); cursor: pointer; }
  /* Cada tarjeta comparte las filas etiqueta / monto / detalle con las demás: los montos quedan alineados aunque una etiqueta ocupe más líneas */
  .franjaEf > div { background: var(--paper); padding: 10px 20px; min-width: 0; display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 0; align-content: start; }
  @supports not (grid-template-rows: subgrid) { .franjaEf > div { display: block; } .franjaEf small { min-height: 2.6em; } }
  .franjaEf small { display: block; font-size: 11px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
  .franjaEf b { font-size: 20px; color: var(--black); font-variant-numeric: tabular-nums; }
  .franjaEf em { display: block; font-style: normal; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .franjaEf .alerta em, .franjaEf .alerta b { color: var(--red); }
  .visor { position: fixed; inset: 0; z-index: 40; background: rgba(11,11,12,.75); display: grid; place-items: center; padding: 20px; }
  .visor img { max-width: min(92vw, 900px); max-height: 86vh; border-radius: 10px; background: #fff; }
  .visor button { position: absolute; top: 16px; right: 16px; }
  @media (max-width: 640px) { .franjaEf > div { padding: 8px 12px; } .franjaEf b { font-size: 16px; } .franjaEf em { display: none; } }

  /* Celular: la página solo se mueve hacia arriba y hacia abajo */
  @media (max-width: 640px) {
    html, body { overflow-x: hidden; max-width: 100%; }
    body { touch-action: pan-y pinch-zoom; }
    .tabs { flex-wrap: wrap; overflow-x: visible; gap: 0 2px; }
    .tabs button { padding: 10px 10px; }
    .tabla { overflow-x: visible; }
    .lienzo { height: 240px; }
    /* Tablas con encabezado → tarjetas: cada fila es un bloque y cada dato lleva su nombre */
    table.tarjetas, table.tarjetas tbody, table.tarjetas tfoot, table.tarjetas tr, table.tarjetas td { display: block; width: 100%; }
    table.tarjetas thead { display: none; }
    table.tarjetas tr { padding: 8px 0; border-bottom: 1px solid var(--line); }
    table.tarjetas td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 3px 0;
                        border: 0; white-space: normal; text-align: right; }
    table.tarjetas td::before { content: attr(data-label); flex: none; max-width: 45%; text-align: left; color: var(--mute);
                                font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    table.tarjetas td.sin-etiqueta::before { display: none; }
    table.tarjetas td.sin-etiqueta { justify-content: flex-start; }
    table.tarjetas td:empty { display: none; }
    table.tarjetas tr > td:first-child { font-weight: 700; color: var(--black); }
    table.tarjetas tfoot tr { border-bottom: 0; }
    table.tarjetas .mini { max-width: 50%; }
  }
  /* ── Tarjetas KPI lado a lado con filas compartidas (etiqueta / valor / detalle / barra): quedan a la misma altura aunque la etiqueta se parta ── */
  @supports (grid-template-rows: subgrid) {
    .kpis { row-gap: 0; margin-bottom: 0; }
    .kpi { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; align-content: start; margin-bottom: 14px; }
  }
  @supports not (grid-template-rows: subgrid) { .kpi .et { min-height: 2.6em; } }
</style>
</head>
<body>
<header>
  <img id="logoInicio" role="button" tabindex="0" title="Ir al menú principal de la app" aria-label="Ir al menú principal de la app" src="logo.jpg" alt="">
  <div class="marca"><b>AUTOCAR<span>SUR</span></b><small>Dashboard de gestión</small></div>
  <div class="der">
    <span id="sync" class="sync hidden" aria-live="polite">Actualizando…</span>
    <span id="badgeDemo" class="demo hidden" title="Datos ficticios. Cambiar Config › DASHBOARD_DEMO a NO para ver datos reales.">DATOS DE PRUEBA</span>
    <span id="quien"></span>
    <a id="volverApp" class="btn-sec hidden" target="_top" href="#" style="text-decoration:none">← App</a>
    <button id="salir" class="btn-sec hidden">Salir</button>
    <span class="salto"></span>
    <button id="btnAct" class="btn-sec hidden" type="button">↻ Actualizar ventas</button>
  </div>
</header>

<!-- Ingreso -->
<section id="vLogin" class="login hidden">
  <h1>Ingreso</h1>
  <p>Acceso solo para administración.</p>
  <div id="usuarios"></div>
  <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="PIN" aria-label="PIN">
  <button id="entrar" class="btn" disabled>Entrar</button>
  <div id="errLogin" class="error"></div>
</section>

<!-- Dashboard -->
<section id="vDash" class="hidden">
  <div class="filtros">
    <div class="seg" id="segPeriodo">
      <button data-p="dia" class="on">Día</button><button data-p="semana">Semana</button><button data-p="mes">Mes</button><button data-p="ano">Año</button><button data-p="pers">Personalizado</button>
    </div>
    <div class="nav">
      <button id="ant" aria-label="Anterior">‹</button>
      <input id="fecha" type="date" aria-label="Día">
      <select id="selMes" class="hidden" aria-label="Mes"></select>
      <select id="selAno" class="hidden" aria-label="Año"></select>
      <button id="sig" aria-label="Siguiente">›</button>
    </div>
    <div class="nav hidden" id="persBox">
      <span class="pers-par"><label class="pers-et" for="persIni">Desde</label><input id="persIni" type="date"></span>
      <span class="pers-par"><label class="pers-et" for="persFin">Hasta</label><input id="persFin" type="date"></span>
    </div>
    <span class="rango" id="rango"></span>
    <select id="local"></select>
    <label id="chkCerrados" class="hidden" title="Locales cerrados (Munita): cuentan en el total histórico. Desmárcalo para comparar solo los locales que siguen abiertos." style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer"><input type="checkbox" id="conCerrados" checked> Incluir locales cerrados</label>
    <div class="seg" id="segIva" title="Las metas se cargan con IVA; sin IVA se dividen por 1,19">
      <button data-i="1" class="on">Con IVA</button><button data-i="0">Sin IVA</button>
    </div>
    <span class="der" id="actualizado"></span>
  </div>
  <div class="act-linea" id="actLinea"><span id="actTxt"></span><small id="actMsg" aria-live="polite"></small></div>
  <div class="franjaEf hidden" id="franjaEf" title="Ver el detalle del efectivo"></div>
  <nav class="tabs" id="tabs">
    <button data-t="resumen" class="on">Resumen</button><button data-t="ventas">Ventas</button>
    <button data-t="productos">Productos y margen</button><button data-t="caja">Caja y cierres</button><button data-t="equipo">Equipo</button><button data-t="efectivo">Efectivo</button><button data-t="clientes">Clientes</button><button data-t="remu">Remuneraciones</button>
  </nav>
  <main id="contenido"><div class="cargando">Cargando datos…</div></main>
</section>

<div class="barra-carga" id="barraCarga" aria-hidden="true"></div>
<div class="cargador" id="cargador" role="status" aria-live="polite">
  <div class="caja"><div class="rueda" aria-hidden="true"></div><p id="cargaTxt">Cargando…</p><div class="pista" aria-hidden="true"><i id="cargaBarra"></i></div><small id="cargaSub"></small></div>
</div>

<script>
/* ═══════════════ Utilidades de fecha (todo en texto AAAA-MM-DD, sin zonas horarias) ═══════════════ */
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIAS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const msF = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const txF = ms => new Date(ms).toISOString().slice(0, 10);
const sumar = (s, n) => txF(msF(s) + n * 864e5);
const dsem = s => (new Date(msF(s)).getUTCDay() + 6) % 7; // 0 = lunes
const entre = (a, b) => Math.round((msF(b) - msF(a)) / 864e5);
const finMes = s => txF(Date.UTC(+s.slice(0, 4), +s.slice(5, 7), 0));
function sumarMeses(s, n) {
  const a = +s.slice(0, 4), m = +s.slice(5, 7) - 1 + n, d = +s.slice(8, 10);
  const ult = new Date(Date.UTC(a, m + 1, 0)).getUTCDate();
  return txF(Date.UTC(a, m, Math.min(d, ult)));
}
const min = (a, b) => (a < b ? a : b), max = (a, b) => (a > b ? a : b);
const fCorta = s => `${+s.slice(8, 10)} ${MESES[+s.slice(5, 7) - 1]}`;
const fMes = m => `${MESES[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
/* Semana ISO (lunes a domingo; la semana 1 es la que contiene el primer jueves del año) → [año, semana] */
function semanaISO(s) {
  const d = new Date(msF(s)); d.setUTCDate(d.getUTCDate() - dsem(s) + 3);
  const a = d.getUTCFullYear(), ene4 = new Date(Date.UTC(a, 0, 4));
  return [String(a), 1 + Math.round(((d - ene4) / 864e5 - 3 + (ene4.getUTCDay() + 6) % 7) / 7)];
}

  if (per === 'semana') { const i = sumar(f, -dsem(f)); return { ini: i, fin: sumar(i, 6) }; }
  if (per === 'mes') return { ini: f.slice(0, 7) + '-01', fin: finMes(f) };

}

  if (per === 'dia') return `${DIAS[dsem(r.ini)]} ${fCorta(r.ini)} ${r.ini.slice(0, 4)}`;
  if (per === 'semana') return `Semana ${fCorta(r.ini)} – ${fCorta(r.fin)}`;
  if (per === 'mes') return `${MESES[+r.ini.slice(5, 7) - 1].replace(/^./, c => c.toUpperCase())} ${r.ini.slice(0, 4)}`;

    g.querySelectorAll('.reserva-alinear').forEach(e => e.remove());
    const cs = [...g.children];
    cs.forEach(c => c.querySelectorAll(':scope > h3, :scope > .sub, :scope > .leyenda').forEach(e => { e.style.minHeight = ''; }));
    const filas = {}; cs.forEach(c => { const t = Math.round(c.getBoundingClientRect().top / 4); (filas[t] = filas[t] || []).push(c); });
    Object.values(filas).forEach(f => {

        if (!h) return;

  html += `<div class="grid dos">

    <div class="card"><h3>Acumulado vs meta</h3><div class="sub">${PER() === 'dia' ? 'Mes en curso' : 'Dentro del período'}</div>
      ${leyenda([['Venta acumulada', COLORES[0], 1], ['Meta acumulada', 'var(--meta)', 1], ['Año anterior', '#C9CCD3', 1]])}<div class="lienzo"><canvas id="gAcu"></canvas></div></div>
  </div>`;

  html += `<div class="grid dos"><div class="card"><h3>Por local</h3><div class="sub">${esc(etiquetaRango(E.per, r))}${enCurso ? ' · a la fecha' : ''}${diaHoy ? ' · acumulado a las ' + horaCarga(R) : ''}</div><div class="tabla">${tablaLocales(r, corte)}</div></div>
    <div class="card"><h3>Alertas</h3><div class="sub">Lo que requiere atención en el período</div>${alertas(r, corte)}</div></div>`;

  let sv = 0, sp = 0, sa = 0; const off = PER() === 'semana' ? -364 : null;

}

function tablaLocales(r, corte) {

function alertas(r, corte) {
  const R = E.R, items = [];
  const add = (nivel, texto) => items.push([nivel, texto]);
  localesVisibles().forEach(l => {
    const a = total(r.ini, corte, l);
    if (!a.p) add('warn', `${l}: no hay presupuesto cargado para este período.`);
    else if (a.vp / a.p < 0.9) add('down', `${l}: va al ${pct(a.vp / a.p, 0)} de la meta (faltan ${mm(a.p - a.vp)}).`);
  });
  const cie = cierresRango(r.ini, corte);
  const difs = cie.filter(c => Math.abs(c.dif) > R.tolerancia);
  if (difs.length) add('down', `${difs.length} cierre(s) con diferencia mayor a ${clp(R.tolerancia)} entre lo declarado y Bicom.`);
  const sin = diasSinCierre(r.ini, min(corte, sumar(R.hoy, -1)));
  if (sin.length) add('warn', `${sin.length} día(s) con ventas y sin cierre registrado.`);
  const fuera = marcasRango(r.ini, r.fin).filter(m => m.ubic === 'FUERA DE RANGO');
  if (fuera.length) add('warn', `${fuera.length} marca(s) de asistencia hechas fuera del local.`);
  const abiertas = jornadas(r.ini, min(r.fin, sumar(R.hoy, -1))).filter(j => !j.salida).length;
  if (abiertas) add('warn', `${abiertas} jornada(s) con entrada y sin salida.`);
  if (R.stockBajo.length) add('neu', `${R.stockBajo.length} producto(s) con stock bajo (ver Productos y margen).`);
  if (!items.length) return '<p class="vacio">Sin alertas en el período 👌</p>';
  const color = { down: 'var(--red)', warn: 'var(--amber)', neu: 'var(--mute)' };
  return `<ul class="alertas">${items.map(([n, t]) => `<li><span class="punto" style="background:${color[n]}"></span><span>${esc(t)}</span></li>`).join('')}</ul>`;
}

/* ═══════════════ Pestaña Ventas ═══════════════ */
/* Tramos de los gráficos de Ventas según el período elegido (cada uno con su equivalente del año anterior):
   Día → 14 días (tendencia) o 12 semanas (promedio) · Semana → 12 semanas · Mes → 12 meses hasta el mes elegido · Año → los 12 meses del año */
function tramosVentas(r, tipo) {
  const t = [];
  if (PER() === 'dia' && tipo === 'tend') {
    for (let i = 13; i >= 0; i--) { const f = sumar(r.ini, -i); t.push({ et: `${DIAS[dsem(f)]} ${+f.slice(8)}`, ini: f, fin: f, aIni: sumar(f, -364), aFin: sumar(f, -364) }); }
  } else if (PER() === 'dia' || PER() === 'semana') {
    const lun = sumar(r.ini, -dsem(r.ini));
    for (let i = 11; i >= 0; i--) { const a = sumar(lun, -7 * i); t.push({ et: fCorta(a), ini: a, fin: sumar(a, 6), aIni: sumar(a, -364), aFin: sumar(a, -358) }); }
  } else {
    for (let i = 0; i < 12; i++) {
      const m = PER() === 'mes' ? sumarMeses(r.ini.slice(0, 7) + '-01', -(11 - i)) : `${r.ini.slice(0, 4)}-${String(i + 1).padStart(2, '0')}-01`;
      const a = sumarMeses(m, -12);
      t.push({ et: `${MESES[+m.slice(5, 7) - 1]} ${m.slice(2, 4)}`, ini: m, fin: finMes(m), aIni: a, aFin: finMes(a) });
    }
  }
  return t;
}
function promDiario(ini, fin) { let v = 0, d = 0; for (let f = ini; f <= fin; f = sumar(f, 1)) { const x = total(f, f).v; if (x > 0) { v += x; d++; } } return d ? v / d : null; }

function tabVentas(r) {
  const R = E.R, fin = min(r.fin, R.ultimaVenta || r.fin), per = PER();
  const lugar = E.local === 'TODOS' ? 'todos los locales' : esc(E.local);
  // Tendencia: ventana corta según el período, contra el mismo tramo del año anterior y el presupuesto
  const tT = tramosVentas(r, 'tend');
  const tituloTend = { dia: 'Tendencia últimos 14 días', semana: 'Tendencia últimas 12 semanas', mes: 'Tendencia últimos 12 meses', ano: `Tendencia por mes · ${r.ini.slice(0, 4)}` }[per];
  // Promedio de venta diaria (venta ÷ días con venta) por tramo
  const tP = tramosVentas(r, 'prom'), vProm = tP.map(x => promDiario(x.ini, x.fin)), vv = vProm.filter(x => x != null);
  const iMax = vProm.indexOf(Math.max(...vv)), iMin = vProm.indexOf(Math.min(...vv));
  const tituloProm = `Promedio de venta diaria por ${per === 'mes' || per === 'ano' ? 'mes' : 'semana'}`;
  const ventanaProm = per === 'dia' || per === 'semana' ? 'últimas 12 semanas' : per === 'mes' ? 'últimos 12 meses' : `meses de ${r.ini.slice(0, 4)}`;
  // Día de la semana: Día = 90 días, Semana = 12 semanas, Mes y Año = el período elegido
  const iniDow = per === 'dia' ? sumar(fin, -89) : per === 'semana' ? sumar(fin, -83) : r.ini, porDia = Array.from({ length: 7 }, () => ({ v: 0, c: 0 }));
  for (let f = iniDow; f <= fin; f = sumar(f, 1)) { const t = total(f, f); if (t.v > 0) { porDia[dsem(f)].v += t.v; porDia[dsem(f)].c++; } }
  const subDow = per === 'dia' ? `Últimos 90 días hasta ${fCorta(fin)}` : per === 'semana' ? `Últimas 12 semanas hasta ${fCorta(fin)}` : `${etiquetaRango(per, r)}${fin < r.fin ? ' · a la fecha' : ''}`;
  const pagos = agrupar(R.pagos, r, 2, 3);
  const vend = agruparVendedores(r);
  const totPagos = pagos.reduce((s, p) => s + p[1], 0);
  // Venta por semana del año, un año sobre otro (toda la historia; el gráfico muestra la ventana del período elegido)
  const sem = {};
  Object.keys(R.diario).forEach(f => {
    if (f > fin) return;
    const v = total(f, f).v; if (!v) return;
    const [a, w] = semanaISO(f); (sem[a] = sem[a] || Array(53).fill(null))[w - 1] = (sem[a][w - 1] || 0) + v;
  });
  const anios = Object.keys(sem).sort().slice(-4);
  const colorAnio = (a, i) => [COLORES[0], COLORES[1], 'var(--meta)', '#C9CCD3'][anios.length - 1 - i] || '#C9CCD3';
  const colorAnioCanvas = (a, i) => [COLORES[0], COLORES[1], '#8A8F98', '#C9CCD3'][anios.length - 1 - i] || '#C9CCD3';
  const semActual = semanaISO(fin);

  let wLo = 1, wHi = 53;
  if (per === 'mes') { wLo = semanaISO(r.ini)[1]; wHi = semanaISO(r.fin)[1]; if (wLo > wHi) { if (r.ini.slice(5, 7) === '12') wHi = 53; else wLo = 1; } }
  else if (per === 'dia' || per === 'semana') { const w = semanaISO(r.ini)[1]; wLo = Math.max(1, w - 6); wHi = Math.min(53, w + 6); }
  const ventanaSem = per === 'ano' ? 'las 53 semanas' : per === 'mes' ? `las semanas del mes (${wLo}–${wHi})` : `13 semanas alrededor de la ${semanaISO(r.ini)[1]}`;

  $('contenido').innerHTML = `

    <div class="card"><h3>Comparativo de ventas por semana</h3><div class="sub">Semanas del año (lunes a domingo) · ${ventanaSem} · cada línea es un año${anios.length < 2 ? ' · la comparación aparece cuando haya más de un año de datos' : ''} · la semana ${semActual[1]} va en curso</div>
      ${leyenda(anios.map((a, i) => [a, colorAnio(a, i), 1]))}<div class="lienzo"><canvas id="gSem"></canvas></div></div>
  </div>
  <div class="grid dos">
    <div class="card"><h3>${tituloTend}</h3><div class="sub">Venta vs mismo tramo del año anterior y presupuesto · ${lugar}</div>
      ${leyenda([['Venta', COLORES[0]], ['Año anterior', '#C9CCD3', 1], ['Presupuesto', 'var(--meta)', 1]])}<div class="lienzo"><canvas id="gTend"></canvas></div></div>
    <div class="card"><h3>Venta promedio por día de la semana</h3><div class="sub">${subDow} · sirve para planificar turnos</div>

  <div class="grid dos">

      ${pagos.length ? `<div class="tabla"><table><tbody>${pagos.map(p => `<tr><td>${esc(p[0])}</td><td style="width:45%"><span class="mini" style="width:${p[1] / pagos[0][1] * 100}%"></span></td>
        <td class="r num">${mm(p[1])}</td><td class="r num">${pct(p[1] / totPagos, 0)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin datos</p>'}</div>
    <div class="card"><h3>Ranking de vendedores</h3><div class="sub">${etiquetaPer(r)} · según Bicom · con IVA</div>
      ${vend.length ? `<div class="tabla"><table><thead><tr><th>Vendedor</th><th></th><th class="r">Venta</th><th class="r">Docs</th><th class="r">Ticket</th></tr></thead><tbody>
      ${vend.map(v => `<tr><td>${esc(v[0])}</td><td style="width:35%"><span class="mini" style="width:${v[1] / vend[0][1] * 100}%"></span></td><td class="r num">${mm(v[1])}</td>
        <td class="r num">${ent(v[2])}</td><td class="r num">${v[2] ? clp(v[1] / v[2]) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin datos</p>'}</div>
  </div>`;

  grafico('gTend', {
    data: {
      labels: tT.map(x => x.et),
      datasets: [
        { label: 'Venta', data: tT.map(x => (x.ini <= (R.ultimaVenta || '') ? total(x.ini, x.fin).v : null)), backgroundColor: COLORES[0], borderRadius: 3, order: 2 },
        { type: 'line', label: 'Año anterior', data: tT.map(x => totalSiCubre(x.aIni, x.aFin).v || null), borderColor: '#C9CCD3', borderWidth: 2, pointRadius: 2, order: 1 },
        { type: 'line', label: 'Presupuesto', data: tT.map(x => total(x.ini, x.fin).p || null), borderColor: '#8A8F98', borderDash: [5, 4], borderWidth: 2, pointRadius: 0, order: 0 },
      ],
    },
  });
  grafico('gDow', {
    data: { labels: DIAS, datasets: [{ label: 'Promedio', data: porDia.map(d => (d.c ? d.v / d.c : 0)), backgroundColor: COLORES[0], borderRadius: 3 }] },
  });
  grafico('gProm', {
    tipo: 'line', etiquetas: { indices: [iMax, iMin, vProm.length - 1].filter((i, k, l) => i >= 0 && vProm[i] != null && l.slice(0, k).every(j => Math.abs(j - i) > 2)), fmt: clp }, // mejor, peor y último tramo (sin encimarse)
    data: {
      labels: tP.map(x => x.et),
      datasets: [{ label: 'Promedio diario', data: vProm, borderColor: COLORES[0], backgroundColor: COLORES[0], borderWidth: 2.5, pointRadius: 3, tension: .25, spanGaps: false }],
    },
  });
  grafico('gSem', {
    tipo: 'line',
    data: {
      labels: Array.from({ length: wHi - wLo + 1 }, (_, i) => String(wLo + i)),
      datasets: anios.map((a, i) => {
        const ultimo = i === anios.length - 1;
        return { label: a, data: sem[a].slice(wLo - 1, wHi), borderColor: colorAnioCanvas(a, i), backgroundColor: colorAnioCanvas(a, i), borderWidth: ultimo ? 2.5 : 1.8,
          borderDash: ultimo ? [] : [6, 4], pointRadius: ultimo ? 3 : 2, pointStyle: ultimo ? 'rect' : 'circle', tension: .15, spanGaps: false };
      }),
    },
  });
}

/* Suma un arreglo mensual [mes, local, clave, monto…] dentro de los meses del período */
function agrupar(filas, r, iClave, iMonto) {
  const ms = meses(r), acc = {};
  filas.forEach(x => { if (enPeriodo(x[0], r) && incluirLocal(x[1]) && (E.local === 'TODOS' || x[1] === E.local)) acc[x[iClave]] = (acc[x[iClave]] || 0) + x[iMonto]; });
  return Object.entries(acc).sort((a, b) => b[1] - a[1]);
}
function agruparVendedores(r) {
  const ms = meses(r), acc = {};
  E.R.vendedores.forEach(([m, l, n, v, d]) => {
    if (!enPeriodo(m, r) || !incluirLocal(l) || (E.local !== 'TODOS' && l !== E.local)) return;
    const a = acc[n] || (acc[n] = [n, 0, 0]); a[1] += v; a[2] += d;
  });
  return Object.values(acc).sort((a, b) => b[1] - a[1]);
}

/* ═══════════════ Pestaña Productos y margen ═══════════════ */
function margenRango(r) {
  const ms = meses(r); let venta = 0, margen = 0;
  E.R.margen.forEach(([m, , v, g]) => { if (ms.includes(m)) { venta += v; margen += g; } });
  return { venta, margen };
}
function tabProductos(r) {

  const familias = Object.values(fam).sort((a, b) => b.g - a.g);
  const mg = margenRango(r);

  $('contenido').innerHTML = `

      ${top.length ? `<div class="tabla"><table><thead><tr><th>Producto</th><th>Familia</th><th class="r">Unid.</th><th class="r">Venta</th><th class="r">% total</th></tr></thead><tbody>
      ${top.map(p => `<tr><td>${esc(p.d)}<br><small style="color:var(--mute)">${esc(p.c)}</small></td><td>${esc(p.f)}</td><td class="r num">${ent(p.q)}</td>
        <td class="r num">${mm(p.v)}</td><td class="r num">${pct(p.v / totV)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin datos</p>'}</div>

/* ═══════════════ Pestaña Caja y cierres ═══════════════ */
function cierresRango(ini, fin, local = E.local) {
  return E.R.cierres.filter(c => c.f >= ini && c.f <= fin && (local === 'TODOS' || c.l === local)).map(c => {
    const b = (E.R.diario[c.f] || {})[c.l];
    return Object.assign({}, c, { bicom: b ? b.b : null, dif: b && b.b ? c.ventas - b.b : 0 }); // el cierre se declara con IVA
  });
}
function conversion(ini, fin, local = E.local) {
  return cierresRango(ini, fin, local).reduce((s, c) => ({ visitas: s.visitas + c.visitas, compras: s.compras + (c.visitas - c.sinCompra) }), { visitas: 0, compras: 0 });
}
function diasSinCierre(ini, fin) {
  const R = E.R, out = []; if (!R.primerCierre) return out;
  const hechos = R.cierresHechos || (R.cierresHechos = new Set(R.cierres.map(c => c.f + '|' + c.l)));
  for (let f = max(ini, R.primerCierre); f <= fin; f = sumar(f, 1)) localesVisibles().forEach(l => {
    const d = (R.diario[f] || {})[l];
    if (d && d.v > 0 && !hechos.has(f + '|' + l)) out.push([f, l]);
  });
  return out;
}

  const conv = conversion(r.ini, fin), sin = diasSinCierre(r.ini, min(fin, sumar(R.hoy, -1)));
  const decl = cie.reduce((s, c) => s + c.ventas, 0), bic = cie.reduce((s, c) => s + (c.bicom || 0), 0);

    ${cie.map(c => `<tr><td>${DIAS[dsem(c.f)]} ${fCorta(c.f)} <small style="color:var(--mute)">${c.h}</small></td><td>${esc(c.l)}</td><td>${esc(c.resp)}</td>
      <td class="r num">${clp(c.ventas)}</td><td class="r num">${c.bicom == null ? '—' : clp(c.bicom)}</td>

      <td class="r num">${clp(c.saldo)}</td><td class="r num">${c.ppto ? pct(c.ventas / c.ppto, 0) : '—'}</td><td class="r num">${ent(c.visitas)}</td>

/* ═══════════════ Pestaña Equipo ═══════════════ */
function marcasRango(ini, fin) {
  return E.R.marcajes.filter(m => m.f >= ini && m.f <= fin && (E.local === 'TODOS' || m.l === E.local));
}
/* Une entrada y salida de cada persona por día */
function jornadas(ini, fin) {
  const out = [], abiertas = {};
  marcasRango(ini, fin).slice().sort((a, b) => (a.f + a.h < b.f + b.h ? -1 : 1)).forEach(m => {
    const k = m.id + '|' + m.f;
    if (m.tipo === 'ENTRADA') { const j = { id: m.id, nombre: m.nombre, f: m.f, l: m.l, entrada: m.h, salida: null }; out.push(j); abiertas[k] = j; }
    else if (abiertas[k]) { abiertas[k].salida = m.h; delete abiertas[k]; }
  });
  return out;
}
const minutos = h => +h.slice(0, 2) * 60 + +h.slice(3, 5);
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.round(m % 60)).padStart(2, '0')}`;
function tabEquipo(r) {
  const R = E.R;
  const hoy = jornadas(R.hoy, R.hoy).filter(j => !j.salida);
  const js = jornadas(r.ini, min(r.fin, R.hoy));
  const per = {};

    const p = per[j.id] || (per[j.id] = { nombre: j.nombre, dias: new Set(), min: 0, cerradas: 0, ent: 0, sal: 0, abiertas: 0, fuera: 0 });
    p.dias.add(j.f); p.ent += minutos(j.entrada);
    if (j.salida) { p.min += minutos(j.salida) - minutos(j.entrada); p.cerradas++; p.sal += minutos(j.salida); } else if (j.f < R.hoy) p.abiertas++;
  });
  const fuera = marcasRango(r.ini, r.fin).filter(m => m.ubic === 'FUERA DE RANGO');
  fuera.forEach(m => { if (per[m.id]) per[m.id].fuera++; });
  const filas = Object.values(per).sort((a, b) => b.min - a.min);

  $('contenido').innerHTML = `

      <td class="r num">${p.cerradas ? hhmm(p.min / p.cerradas) : '—'}</td><td class="r num">${hhmm(p.ent / p.dias.size)}</td>
      <td class="r num">${p.cerradas ? hhmm(p.sal / p.cerradas) : '—'}</td>
      <td class="r num">${p.abiertas ? `<span class="chip warn">${p.abiertas}</span>` : '0'}</td>
      <td class="r num">${p.fuera ? `<span class="chip warn">${p.fuera}</span>` : '0'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vacio">Sin marcas en el período</p>'}</div>
  ${fuera.length ? `<div class="card"><h3>Marcas fuera del local</h3><div class="sub">Hechas a más distancia que el radio permitido</div><div class="tabla"><table>
    <thead><tr><th>Fecha</th><th>Persona</th><th>Local</th><th>Tipo</th><th class="r">Distancia</th></tr></thead><tbody>

}

/* ═══════════════ Clientes: entradas declaradas en el cierre de día, cruzadas con las boletas de Bicom ═══════════════ */
function clientes(ini, fin, local = E.local) {

  cie.forEach(c => { const d = (E.R.diario[c.f] || {})[c.l]; if (d) { boletas += d.n; conBicom++; } });
  return { entradas: cie.reduce((s, c) => s + c.visitas, 0), compras: cie.reduce((s, c) => s + c.visitas - c.sinCompra, 0),
    dias: new Set(cie.map(c => c.f)).size, cierres: cie.length, boletas, conBicom };
}

/* ═══════════════ Remuneraciones (siempre reales: salen de las liquidaciones) ═══════════════
   fila: [periodo, id, nombre, imponible, haberes, asigFamiliar, base, gratificacion, horasExtra, bonos, otrosImp,
          movilizacion, otrosNoImp, afp, salud, cesantia, otrosDesc, descuentos, liquido] */
function tabRemu() {
  const rem = E.R.remuneraciones;
  if (!rem || !rem.filas.length) {
    $('contenido').innerHTML = '<div class="card"><h3>Remuneraciones</h3><p class="vacio">Aún no hay liquidaciones cargadas.</p></div>';
    return;
  }
  const ap = rem.aportePct / 100;
  // Costo empresa = haberes − asignación familiar (la financia el Estado) + aportes del empleador (estimados sobre el imponible)
  const costo = f => f[4] - f[5] + f[3] * ap, aporte = f => f[3] * ap;
  const sum = (fs, fn) => fs.reduce((s, f) => s + fn(f), 0);
  const periodos = [...new Set(rem.filas.map(f => f[0]))].sort();
  const doce = periodos.slice(-12), ult = doce[doce.length - 1], ant = periodos[periodos.length - 2];
  const delMes = p => rem.filas.filter(f => f[0] === p);
  const filas12 = rem.filas.filter(f => doce.includes(f[0]));
  const cUlt = sum(delMes(ult), costo), cAnt = ant ? sum(delMes(ant), costo) : 0, total12 = sum(filas12, costo);
  const variacion = (a, b) => (b ? `<span class="chip neu">${a >= b ? '▲' : '▼'} ${pct(Math.abs(a / b - 1))}</span> vs ${fMes(ant)}` : '');
  const ventaNeta = E.R.demo ? 0 : doce.reduce((s, m) => s + totalMes(m, 'TODOS').nt, 0);

  let html = '<div class="grid kpis">';
  html += kpi(`Costo empresa · ${fMes(ult)}`, clp(cUlt), variacion(cUlt, cAnt));
  html += kpi(`Líquido pagado · ${fMes(ult)}`, clp(sum(delMes(ult), f => f[18])), `${delMes(ult).length} persona(s) en la planilla`);
  html += kpi(`Costo empresa · ${doce.length} meses`, clp(total12), `Promedio mensual ${clp(total12 / doce.length)}`);
  html += ventaNeta ? kpi('Sobre la venta neta', pct(total12 / ventaNeta), `Remuneraciones / venta sin IVA, ${doce.length} meses`)
    : kpi('Aportes del empleador', clp(sum(filas12, aporte)), `Estimados al ${String(rem.aportePct).replace('.', ',')}% del imponible`);
  html += '</div>';

  html += `<div class="card" style="margin-bottom:14px"><h3>Costo mensual de remuneraciones</h3>
    <div class="sub">${esc(fMes(doce[0]))} – ${esc(fMes(ult))} · no depende del período ni del local elegidos arriba</div>
    ${leyenda([['Sueldo líquido', COLORES[0]], ['Descuentos del trabajador (AFP, salud, cesantía)', COLORES[1]], ['Aportes del empleador (estimado)', COLORES[2]]])}
    <div class="lienzo"><canvas id="gRemu"></canvas></div></div>`;

  // Por persona
  const personas = {};
  filas12.forEach(f => {
    const p = personas[f[1]] || (personas[f[1]] = { nombre: f[2], total: 0, meses: 0, ult: 0, liqUlt: 0 });
    p.total += costo(f); p.meses++;
    if (f[0] === ult) { p.ult = costo(f); p.liqUlt = f[18]; }
  });
  const lp = Object.values(personas).sort((a, b) => b.total - a.total);
  html += `<div class="grid dos"><div class="card"><h3>Por persona</h3><div class="sub">Costo empresa</div><div class="tabla"><table>
    <thead><tr><th>Persona</th><th class="r">${esc(fMes(ult))}</th><th class="r">Líquido ${esc(fMes(ult))}</th><th class="r">Promedio mensual</th><th class="r">${doce.length} meses</th></tr></thead><tbody>
    ${lp.map(p => `<tr><td>${esc(p.nombre)}</td><td class="r num">${p.ult ? clp(p.ult) : '—'}</td><td class="r num">${p.liqUlt ? clp(p.liqUlt) : '—'}</td>
      <td class="r num">${clp(p.total / p.meses)}</td><td class="r num"><b>${clp(p.total)}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="r num">${clp(cUlt)}</td><td class="r num">${clp(sum(delMes(ult), f => f[18]))}</td><td class="r num">${clp(total12 / doce.length)}</td><td class="r num">${clp(total12)}</td></tr></tfoot></table></div></div>`;

  // Por concepto
  const conceptos = [
    ['Sueldo base', f => f[6]], ['Gratificación', f => f[7]], ['Horas extra', f => f[8]], ['Bonos', f => f[9]],
    ['Otros imponibles', f => f[10]], ['Movilización y otros no imponibles', f => f[11] + f[12]],
    [`Aportes del empleador (estimado ${String(rem.aportePct).replace('.', ',')}%)`, aporte],
  ].filter(([, fn]) => sum(filas12, fn));
  html += `<div class="card"><h3>Por concepto</h3><div class="sub">Qué compone el costo empresa</div><div class="tabla"><table>
    <thead><tr><th>Concepto</th><th class="r">${esc(fMes(ult))}</th><th class="r">${doce.length} meses</th><th class="r">% del costo</th></tr></thead><tbody>
    ${conceptos.map(([n, fn]) => `<tr><td>${esc(n)}</td><td class="r num">${clp(sum(delMes(ult), fn))}</td><td class="r num">${clp(sum(filas12, fn))}</td>
      <td class="r num">${pct(sum(filas12, fn) / total12)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Costo empresa</td><td class="r num">${clp(cUlt)}</td><td class="r num">${clp(total12)}</td><td class="r num">100%</td></tr></tfoot></table></div>
    <p class="sub" style="margin-top:10px">El sueldo ya incluye lo que se descuenta al trabajador para AFP, salud y cesantía (${clp(sum(filas12, f => f[17]))} en ${doce.length} meses).
    La asignación familiar (${clp(sum(filas12, f => f[5]))}) no se cuenta como costo porque la financia el Estado.
    Los aportes del empleador son una estimación: se ajustan en Config › APORTE_EMPLEADOR_PCT.</p></div></div>`;

  // Confirmación de liquidaciones
  const estadoConf = e => (e === 'VISTO' ? '<span class="chip warn">La abrió, falta confirmar</span>' : '<span class="chip down">No la ha abierto</span>');
  const nombreDoc = x => (x[3] && x[3] !== 'Liquidación de sueldo' ? `${x[3]}: ${x[4] || fMes(x[1])}` : `Liquidación ${fMes(x[1])}`);
  html += `<div class="card"><h3>Confirmación de documentos</h3><div class="sub">"Recibí conforme" en la app · liquidaciones, contratos y anexos</div>
    ${rem.porConfirmar.length ? `<div class="tabla"><table><thead><tr><th>Persona</th><th>Documento</th><th>Estado</th></tr></thead><tbody>
      ${rem.porConfirmar.sort((a, b) => (a[1] < b[1] ? 1 : -1)).map(x => `<tr><td>${esc(x[0])}</td><td>${esc(nombreDoc(x))}</td><td>${estadoConf(x[2])}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="vacio">Todos los documentos están confirmados 👌</p>'}
    ${rem.confirmados.length ? `<div class="tabla" style="margin-top:12px"><table><thead><tr><th>Persona</th><th>Documento</th><th>Confirmado</th></tr></thead><tbody>
      ${rem.confirmados.sort((a, b) => (a[2] < b[2] ? 1 : -1)).map(x => `<tr><td>${esc(x[0])}</td><td>${esc(nombreDoc(x))}</td><td><span class="chip up">${esc(fCorta(x[2]))}</span></td></tr>`).join('')}
      </tbody></table></div>` : ''}</div>`;

  $('contenido').innerHTML = html;
  grafico('gRemu', {
    apilado: true,
    data: {
      labels: doce.map(fMes),
      datasets: [
        { label: 'Sueldo líquido', data: doce.map(p => Math.round(sum(delMes(p), f => f[18] - f[5]))), backgroundColor: COLORES[0] },
        { label: 'Descuentos del trabajador', data: doce.map(p => Math.round(sum(delMes(p), f => f[17]))), backgroundColor: COLORES[1] },
        { label: 'Aportes del empleador', data: doce.map(p => Math.round(sum(delMes(p), aporte))), backgroundColor: COLORES[2] },
      ],
    },
  });
}

/* ═══════════════ Datos ficticios (misma estructura que los datos reales) ═══════════════ */
function generarDemo(R) {
  let s = 20261029; const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const azar = (a, b) => a + rnd() * (b - a), elegir = a => a[Math.floor(rnd() * a.length)];
  const ayer = sumar(R.hoy, -1), inicio = '2022-09-01';
  const L = R.locales.length ? R.locales : ['Violeta Parra', 'Gabriela Mistral'];
  R.locales = L;
  const perfilLocal = [
    { base: 6.4e6, crec: 0.17, ticket: 17500, abre: '2022-09-01' },
    { base: 3.6e6, crec: 0.30, ticket: 24000, abre: '2025-06-02' },
  ];
  const DOW = [0.95, 0.95, 1, 1, 1.15, 1.25, 0.45], ESTAC = [0.92, 0.9, 1, 0.98, 0.97, 0.95, 1, 1, 1.08, 1.02, 1.05, 1.18];
  const FERIADOS = ['01-01', '05-01', '09-18', '09-19', '12-25'];
  const dias = [], ppto = [], mesLocal = {};
  for (let f = inicio; f <= sumar(R.hoy, 70); f = sumar(f, 1)) {
    if (FERIADOS.includes(f.slice(5))) continue;
    L.forEach((l, i) => {
      const p = perfilLocal[i] || perfilLocal[1];
      if (f < p.abre) return;
      const meses = entre(p.abre, f) / 30.4;
      const mensual = p.base * (1 + p.crec * meses / 12) * ESTAC[+f.slice(5, 7) - 1] * Math.min(1, 0.3 + meses / 10); // los primeros meses de un local venden menos
      const esperado = mensual * 12 / 365 / 0.964 * DOW[dsem(f)];
      ppto.push([f, l, Math.round(esperado * 1.06 / 1000) * 1000]);
      if (f > ayer) return;
      const v = Math.round(esperado * azar(0.74, 1.24));
      const n = Math.max(1, Math.round(v / (p.ticket * azar(0.9, 1.1))));
      dias.push([f, l, v, n, Math.round(v / IVA)]);
      const k = f.slice(0, 7) + '|' + l; const m = mesLocal[k] || (mesLocal[k] = { v: 0, n: 0 }); m.v += v; m.n += n;
    });
  }
  // Presupuesto: solo hasta el fin del mes siguiente
  const limitePpto = finMes(sumarMeses(R.hoy.slice(0, 7) + '-01', 1));
  R.ppto = ppto.filter(p => p[0] <= limitePpto);
  R.dias = dias;

  const FORMAS = [['Débito', .44], ['Efectivo', .24], ['Crédito', .16], ['Transferencia', .13], ['Crédito empresa', .03]];
  const CATALOGO = [
    ['LUB-1040', 'Aceite 10W-40 semisintético 4 L', 'Lubricantes', 21990, 9], ['LUB-5W30', 'Aceite 5W-30 sintético 4 L', 'Lubricantes', 32990, 6],
    ['LUB-15W40', 'Aceite diésel 15W-40 5 L', 'Lubricantes', 28990, 5], ['LUB-ATF', 'Aceite transmisión ATF 1 L', 'Lubricantes', 7990, 3],
    ['FIL-AC01', 'Filtro de aceite universal', 'Filtros', 5490, 8], ['FIL-AI02', 'Filtro de aire', 'Filtros', 8990, 5],
    ['FIL-CB03', 'Filtro de combustible diésel', 'Filtros', 12990, 4], ['FIL-PO04', 'Filtro de polen', 'Filtros', 7490, 2],
    ['FRE-PD01', 'Pastillas de freno delanteras', 'Frenos', 24990, 6], ['FRE-DS02', 'Disco de freno ventilado', 'Frenos', 39990, 3],
    ['FRE-LQ03', 'Líquido de frenos DOT4 500 ml', 'Frenos', 5990, 3], ['FRE-ZP04', 'Zapatas de freno traseras', 'Frenos', 21990, 2],
    ['ELE-BT45', 'Batería 45 Ah', 'Eléctrico', 69990, 3], ['ELE-BT65', 'Batería 65 Ah', 'Eléctrico', 89990, 2],
    ['ELE-H4', 'Ampolleta H4 12V', 'Eléctrico', 3990, 6], ['ELE-FUS', 'Set de fusibles', 'Eléctrico', 2990, 3],
    ['ENC-BUJ', 'Bujía de encendido', 'Encendido', 4990, 5], ['ENC-CAB', 'Juego cables de bujía', 'Encendido', 24990, 2],
    ['REF-ANT', 'Refrigerante 50% 1 gal', 'Refrigerantes', 9990, 5], ['ACC-PLU', 'Plumillas limpiaparabrisas (par)', 'Accesorios', 11990, 5],
    ['ACC-AMB', 'Aromatizante', 'Accesorios', 2490, 4], ['ACC-LIQ', 'Líquido limpiaparabrisas 2 L', 'Accesorios', 2990, 4],
    ['COR-DIS', 'Correa de distribución', 'Transmisión', 34990, 2], ['COR-ALT', 'Correa alternador', 'Transmisión', 12990, 3],
    ['SUS-AMO', 'Amortiguador delantero', 'Suspensión', 44990, 2], ['SUS-ROT', 'Rótula de suspensión', 'Suspensión', 16990, 2],
    ['FER-SIL', 'Silicona alta temperatura', 'Ferretería', 4990, 3], ['FER-WD4', 'Lubricante multiuso 400 ml', 'Ferretería', 6990, 3],
    ['SRV-CAM', 'Servicio cambio de aceite', 'Servicios taller', 15000, 4], ['SRV-FRE', 'Servicio cambio de pastillas', 'Servicios taller', 25000, 2],
    ['SRV-DIA', 'Diagnóstico escáner', 'Servicios taller', 20000, 2],
  ];
  const MARGEN_FAM = { Lubricantes: .27, Filtros: .38, Frenos: .34, 'Eléctrico': .29, Encendido: .40, Refrigerantes: .42, Accesorios: .45,
    'Transmisión': .33, 'Suspensión': .31, 'Ferretería': .36, 'Servicios taller': .70 };
  const vendedoresDe = l => {
    const v = R.equipo.filter(t => !/dueñ|consult/i.test(t.perfil || '') && (t.local === l || /ambos/i.test(t.local || '') || !t.local)).map(t => t.nombre);
    return v.length ? v : ['Vendedor 1', 'Vendedor 2'];
  };
  R.pagos = []; R.vendedores = []; R.productos = []; const margenMes = {};
  Object.keys(mesLocal).forEach(k => {
    const [mes, l] = k.split('|'), tot = mesLocal[k];
    let resto = tot.v;
    FORMAS.forEach(([fp, w], i) => { const m = i === FORMAS.length - 1 ? resto : Math.round(tot.v * w * azar(0.85, 1.15)); resto -= m; R.pagos.push([mes, l, fp, Math.max(0, m)]); });
    const vs = vendedoresDe(l), pesos = vs.map(() => azar(0.6, 1.4)), sp = pesos.reduce((a, b) => a + b, 0);
    vs.forEach((n, i) => R.vendedores.push([mes, l, n, Math.round(tot.v * pesos[i] / sp), Math.round(tot.n * pesos[i] / sp)]));
    const taller = L.indexOf(l) === 1;
    const pw = CATALOGO.map(p => p[4] * azar(0.6, 1.4) * (p[2] === 'Servicios taller' ? (taller ? 1.6 : 0) : 1));
    const spw = pw.reduce((a, b) => a + b, 0);
    CATALOGO.forEach((p, i) => {
      if (!pw[i]) return;
      const monto = Math.round(tot.v * pw[i] / spw);
      R.productos.push([mes, l, p[0], p[1], p[2], Math.max(1, Math.round(monto / p[3])), monto]);
      const km = mes + '|' + p[2], a = margenMes[km] || (margenMes[km] = [0, 0]);
      const neto = monto / 1.19; a[0] += neto; a[1] += neto * (MARGEN_FAM[p[2]] + azar(-0.03, 0.03));
    });
  });
  R.margen = Object.keys(margenMes).map(k => k.split('|').concat(Math.round(margenMes[k][0]), Math.round(margenMes[k][1])));

  // Cierres desde 2023 (en la realidad parten con la app; aquí hay historia para ver los comparativos)
  const OBS = ['Se cortó la luz 20 min', 'Cliente pidió cotización de batería', 'Faltó stock de filtros de aire', 'Día lluvioso, poco movimiento',
    'Llegó pedido de proveedor', 'POS se demoró en la tarde'];
  R.cierres = [];
  dias.filter(d => d[0] >= '2023-01-01').forEach(([f, l, v, n]) => {
    if (rnd() < 0.06) return;
    const malo = rnd() < 0.06, vs = vendedoresDe(l);
    const decl = Math.round((v * (1 + azar(-0.004, 0.004)) + (malo ? elegir([-1, 1]) * azar(6000, 25000) : 0)) / 10) * 10;
    const visitas = Math.round(n / azar(0.62, 0.8));
    const meta = (R.ppto.find(p => p[0] === f && p[1] === l) || [])[2] || 0;
    R.cierres.push({ f, h: hhmm(azar(19 * 60 + 5, 19 * 60 + 50)), l, resp: elegir(vs), saldo: Math.round(v * azar(0.18, 0.3) / 100) * 100, ventas: decl,
      ppto: meta, visitas, sinCompra: visitas - n, obs: rnd() < 0.1 ? elegir(OBS) : '', ubic: rnd() < 0.97 ? 'EN LOCAL' : 'FUERA DE RANGO' });
  });

  // Marcajes de los últimos 90 días (y hoy hasta la hora actual)
  R.marcajes = [];
  const ahora = minutos(R.hora || '12:00');
  const personas = R.equipo.filter(t => !/dueñ|consult/i.test(t.perfil || ''));
  (personas.length ? personas : [{ id: 'T900', nombre: 'Trabajador demo', local: L[0] }]).forEach(t => {
    for (let f = sumar(R.hoy, -90); f <= R.hoy; f = sumar(f, 1)) {
      if (dsem(f) === 6 && rnd() < 0.7) continue;
      if (rnd() < 0.07 || FERIADOS.includes(f.slice(5))) continue;
      const l = L.includes(t.local) ? t.local : elegir(L);
      const e = azar(8 * 60 + 40, 9 * 60 + 25), sa = azar(18 * 60 + 40, 19 * 60 + 40);
      const fuera = rnd() < 0.03;
      const marca = (h, tipo, fr) => R.marcajes.push({ f, h: hhmm(h), id: t.id, nombre: t.nombre, l, tipo,
        ubic: fr ? 'FUERA DE RANGO' : 'EN LOCAL', dist: fr ? Math.round(azar(250, 900)) : Math.round(azar(5, 60)) });
      if (f === R.hoy) { if (ahora > e) marca(e, 'ENTRADA', false); if (ahora > sa) marca(sa, 'SALIDA', false); continue; }
      marca(e, 'ENTRADA', fuera);
      if (rnd() > 0.02) marca(sa, 'SALIDA', false);
    }
  });

  R.stockBajo = [['BAT-70', 'Batería 70 Ah', L[0], 0], ['FIL-AI02', 'Filtro de aire', L[1] || L[0], 1], ['LUB-5W30', 'Aceite 5W-30 sintético 4 L', L[0], 2],
    ['FRE-DS02', 'Disco de freno ventilado', L[1] || L[0], 1], ['ENC-CAB', 'Juego cables de bujía', L[0], 0], ['COR-DIS', 'Correa de distribución', L[1] || L[0], 2],
    ['SUS-AMO', 'Amortiguador delantero', L[0], 1], ['ELE-H7', 'Ampolleta H7 12V', L[1] || L[0], 3]];
}
